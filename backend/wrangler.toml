name = "overhead-tle-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

# KV namespace for TLE caching.
# After running `npm run deploy` for the first time, Cloudflare will create this
# namespace automatically and print its ID. If deploying fresh, run:
#   npx wrangler kv namespace create TLE_CACHE
# then paste the returned `id` below.
[[kv_namespaces]]
binding = "TLE_CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
